<script>
/* 2026-09-14：號碼在格子裡置中（畫面與存圖共用）
   使用者指示：「只要是號碼在格子裡，不管是什麼字體，不管是螢幕顯示還是存圖檔，號碼都必須在格子裡置中」。
   原本的作法是對 .cell-shift 用手調的 transform:translate(百分比) 逐一補償，換字體就會偏掉。
   這裡改成「量字形墨跡」：用 canvas measureText 的 actualBoundingBox(Ascent/Descent/Left/Right) 取得該字體、該字串
   真正的墨跡框，再把墨跡中心對到格子(padding box)中心。
   ・畫面：對 table.road 的 td.num / td.day(非月初格) 裡的 .cell-shift，量完後以 inline transform:translate(px) 修正，
     保留 CSS 原本的 scale；表格重畫、body class 改變(定期模式/字體/色系/放大鏡)、字型載入完成、視窗尺寸改變時重算。
   ・存圖：body 帶 capturing-* 時先把 inline 修正清掉(文字是透明的、由 canvas 補畫)，補畫時用 fillTextInkCentered()。
   ・不支援 actualBoundingBox 的舊瀏覽器：畫面不修正、存圖退回原本的 textBaseline=middle 作法。 */
(function(){
  var SEL="table.road td.num .cell-shift, table.road td.day:not(.first-of-month) .cell-shift";
  var CAPTURE_CLASSES=["capturing-plain","capturing-save-only","capturing-clean-sheet"];
  var mcv=null,mctx=null,cache={},baseCache={},supported=null;
  function measurer(){ if(!mctx){ mcv=document.createElement("canvas"); mctx=mcv.getContext("2d"); } return mctx; }
  var PROBE_PX=200; /* 小字級(9px上下)的 actualBoundingBox 會被整數化(±0.5px≈5%)，改成用 200px 量再等比縮回 */
  function probeFont(font,px){ return font.replace(/(\d*\.?\d+)px/,PROBE_PX+"px"); }
  function measureInk(c,font,text){
    c.textAlign="left"; c.textBaseline="alphabetic"; /* actualBoundingBox 是相對目前的 textAlign/textBaseline，量測前一定要歸零 */
    var mm=font.match(/(\d*\.?\d+)px/); var px=mm?parseFloat(mm[1]):0;
    if(!(px>0)){ c.font=font; var t0=c.measureText(text); if(typeof t0.actualBoundingBoxAscent!=="number")return null; return{asc:t0.actualBoundingBoxAscent,desc:t0.actualBoundingBoxDescent,left:t0.actualBoundingBoxLeft,right:t0.actualBoundingBoxRight,adv:t0.width}; }
    c.font=probeFont(font,px); var t=c.measureText(text);
    if(typeof t.actualBoundingBoxAscent!=="number")return null;
    /* 字型還在載入時 canvas 會忽略 ctx.font 的指定(字級留在原值)：讀回實際生效的字級來算縮放比，避免量錯 */
    var back=String(c.font).match(/(\d*\.?\d+)px/); var usedPx=back?parseFloat(back[1]):PROBE_PX; if(!(usedPx>0))usedPx=PROBE_PX;
    var k=px/usedPx;
    return{asc:t.actualBoundingBoxAscent*k,desc:t.actualBoundingBoxDescent*k,left:t.actualBoundingBoxLeft*k,right:t.actualBoundingBoxRight*k,adv:t.width*k};
  }
  function inkMetrics(font,text){
    var k=font+"|"+text; if(cache[k])return cache[k];
    var c=measurer(); if(!c)return null; var m=measureInk(c,font,text);
    if(!m){ supported=false; return null; }
    supported=true; cache[k]=m; return m;
  }
  function parseMatrix(t){
    if(!t||t==="none")return{s:1,e:0,f:0};
    var m=t.match(/matrix\(([^)]+)\)/); if(!m)return{s:1,e:0,f:0};
    var p=m[1].split(",").map(function(s){return parseFloat(s)});
    if(p.length<6)return{s:1,e:0,f:0};
    var sx=Math.sqrt(p[0]*p[0]+p[1]*p[1]),sy=Math.sqrt(p[2]*p[2]+p[3]*p[3]);
    return{s:(sx+sy)/2,e:p[4],f:p[5]};
  }
  /* 祖先(頁面縮放/放大鏡/截圖 scaleY)造成的螢幕縮放：用整張表格的尺寸估，比小格子的整數 offsetWidth 準 */
  function ancestorScale(td){
    var ref=td.closest("table")||td; var rr=ref.getBoundingClientRect();
    var x=ref.offsetWidth?rr.width/ref.offsetWidth:1,y=ref.offsetHeight?rr.height/ref.offsetHeight:1;
    if(!(x>0)||!isFinite(x))x=1; if(!(y>0)||!isFinite(y))y=1; return{x:x,y:y};
  }
  /* 格子的 padding box(扣掉框線)：畫面上格線之間看得到的那塊 */
  function cellInnerBox(td){
    var r=td.getBoundingClientRect(); if(r.width<=0||r.height<=0)return null;
    var cs=getComputedStyle(td);
    var bl=parseFloat(cs.borderLeftWidth)||0,br=parseFloat(cs.borderRightWidth)||0,bt=parseFloat(cs.borderTopWidth)||0,bb=parseFloat(cs.borderBottomWidth)||0;
    var sc=ancestorScale(td);var sx=sc.x,sy=sc.y;
    var left=r.left+bl*sx,top=r.top+bt*sy,w=r.width-(bl+br)*sx,h=r.height-(bt+bb)*sy;
    if(w<=0||h<=0){left=r.left;top=r.top;w=r.width;h=r.height}
    return{left:left,top:top,width:w,height:h,cx:left+w/2,cy:top+h/2,sx:sx,sy:sy};
  }
  /* canvas 補畫文字：墨跡中心對到 (cx,cy)。ctx.font / fillStyle 由呼叫端先設好 */
  function fillTextInkCentered(ctx,text,cx,cy){
    var font=ctx.font; var m=measureInk(ctx,font,text); ctx.font=font;
    if(!m){ ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(text,cx,cy); return; }
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillText(text,cx-(m.right-m.left)/2,cy+(m.asc-m.desc)/2);
  }
  /* 基線在 span 盒子裡的位置(未縮放的本地 px)：同字體/同行高/同高度的 span 共用一次量測 */
  function baselineOffset(el,cs,sy){
    var k=cs.fontFamily+"|"+cs.fontSize+"|"+cs.fontWeight+"|"+cs.lineHeight+"|"+el.offsetHeight;
    if(baseCache[k]!==undefined)return baseCache[k];
    var marker=document.createElement("span");
    marker.style.cssText="display:inline-block;width:0;height:0;padding:0;margin:0;border:0;vertical-align:baseline;overflow:hidden;";
    el.appendChild(marker);
    var top=el.getBoundingClientRect().top,base=marker.getBoundingClientRect().top;
    el.removeChild(marker);
    var off=sy?(base-top)/sy:0; baseCache[k]=off; return off;
  }
  var padCache={},probeEl=null;
  /* tabular-nums 補白：同字體(200px 探針)同一個字，tabular-nums 與 normal 的前進寬差(換算回實際字級)；沒差就是 0 */
  function tabPad(font,ch,tab){
    if(!tab)return 0; var k=font+"|"+ch; if(padCache[k]!==undefined)return padCache[k];
    var pad=0;
    try{
      if(!probeEl){ probeEl=document.createElement("span"); probeEl.style.cssText="position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;display:inline-block;padding:0;margin:0;border:0;letter-spacing:0;pointer-events:none;"; probeEl.setAttribute("aria-hidden","true"); }
      if(!probeEl.parentNode)document.body.appendChild(probeEl);
      var mm=font.match(/(\d*\.?\d+)px/); var px=mm?parseFloat(mm[1]):0;
      probeEl.style.font=probeFont(font,px); probeEl.textContent=ch;
      probeEl.style.fontVariantNumeric="normal"; var w0=probeEl.getBoundingClientRect().width;
      probeEl.style.fontVariantNumeric="tabular-nums"; var w1=probeEl.getBoundingClientRect().width;
      var d=w1-w0; if(px>0&&isFinite(d)&&d>0.01)pad=d*px/PROBE_PX;
    }catch(e){ pad=0; }
    padCache[k]=pad; return pad;
  }
  function perCharInkCenter(el,text,font,sx){
    try{
      if(!text||text.length>6||typeof document.createRange!=="function")return null;
      var ecs=getComputedStyle(el); var tab=/tabular-nums/.test(ecs.fontVariantNumeric||"")||/["']tnum["']\s*(1|on)?\b(?!\s*0)/.test(ecs.fontFeatureSettings||"");
      var tn=null; for(var c=el.firstChild;c;c=c.nextSibling){ if(c.nodeType===3&&c.nodeValue.trim()){ if(tn)return null; tn=c; } else if(c.nodeType===1)return null; }
      if(!tn)return null; var start=tn.nodeValue.indexOf(text); if(start<0)return null;
      var minX=Infinity,maxX=-Infinity;
      for(var i=0;i<text.length;i++){
        var rg=document.createRange(); rg.setStart(tn,start+i); rg.setEnd(tn,start+i+1);
        var b=rg.getBoundingClientRect(); if(!(b.width>0))return null;
        var g=inkMetrics(font,text.charAt(i)); if(!g)return null;
        /* 起點＝前進框左緣，再加 tabular-nums 的補白一半：App 的 td.num 設了 font-variant-numeric:tabular-nums(等寬數字)，
           手機字體(Roboto 等)的 1 比其他數字窄，等寬時字形置中放在固定寬度裡，canvas 量不到這個特性(canvas 沒有 tabular 設定)，
           這就是「11」偏右的原因。補白量用 DOM 探針量「同字體同字 normal 與 tabular-nums 的寬度差」(tabPad)，不是用前進框寬減 canvas 字寬——
           後者會把「小字級排版把前進寬取整」(字形仍畫在起點、不置中)誤當成補白。 */
        var ox=b.left+tabPad(font,text.charAt(i),tab)*sx/2;
        var l=ox-g.left*sx,rt=ox+g.right*sx;
        if(l<minX)minX=l; if(rt>maxX)maxX=rt;
      }
      if(!isFinite(minX)||!isFinite(maxX)||maxX<=minX)return null;
      return (minX+maxX)/2;
    }catch(e){ return null; }
  }
  function inCapture(){ var b=document.body; return !!b&&CAPTURE_CLASSES.some(function(c){return b.classList.contains(c)}); }
  function clearInline(els){
    els.forEach(function(el){ if(el.getAttribute("data-ink-centered")){ el.style.transform=""; el.removeAttribute("data-ink-centered"); } });
  }
  function recenter(els){
    if(!document.body)return;
    /* 2026-09-22：平滑捲動進行中(body.c-drag-scroll)不重算——整張表只是 translateY，格內幾何不變；放手拿掉這個 class 時 body 的 class 觀察器會排一次全表重算 */
    if(document.body.classList.contains("c-drag-scroll")||__inkHold){ __inkSkipped=true; return; }
    if(!els)els=Array.prototype.slice.call(document.querySelectorAll(SEL));
    if(!els.length)return;
    if(inCapture()||supported===false){ clearInline(els); return; }
    clearInline(els);
    var jobs=[];
    els.forEach(function(el){
      var td=el.closest("td"); if(!td)return;
      var text=(el.textContent||"").trim(); if(!text)return;
      var cs=getComputedStyle(el); if(cs.display==="none"||cs.visibility==="hidden")return;
      var r=el.getBoundingClientRect(); if(r.width<=0||r.height<=0)return;
      var box=cellInnerBox(td); if(!box)return;
      var font=(cs.fontStyle&&cs.fontStyle!=="normal"?cs.fontStyle+" ":"")+cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
      var m=inkMetrics(font,text); if(!m)return;
      var mt=parseMatrix(cs.transform);
      var sx=box.sx*mt.s,sy=box.sy*mt.s; /* span 的螢幕縮放 = 祖先縮放(由整張表格估) × 自己的 scale */
      var padL=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.borderLeftWidth)||0);
      var inkCx=r.left+padL*sx+(m.right-m.left)/2*sx;
      /* 2026-09-15：使用者回報全頁(放大 5 倍)裡「11」沒有置中——字的位置是瀏覽器在小字級(約 12px)排版時決定的(每個字的前進寬度會被
         取整/微調)，再被 transform 放大 5 倍，所以整串用 canvas 量出來的墨跡中心跟實際畫面對不上(含 1 的號碼偏右、0/8 偏左)。
         改成逐字：每個字的「起點」直接用 DOM Range 量到的實際字框(已含排版取整、tabular-nums、字距)，只有字形本身的墨跡範圍用 canvas 量，

  :root{
    --gold:#E8B800;
    --ink:#1a1a1a;
    --ink-dim:#666666;
    --line:#8c8c8c;
    --wd-gray:#c8c8c8;
    --wd-text:#141414;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  html,body{ overscroll-behavior-y:contain; }
  html,body,*{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  body{
    background:#e9e9e9;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:24.7px;
    overflow-x:hidden;
    touch-action:pan-x pan-y;
    overscroll-behavior-y:none;
  }
  body.pinch-fullscreen-mode{
    overscroll-behavior:none;
  }
  #page-zoom-wrap{
    transform-origin:0 0;
    width:max-content;
    min-width:100%;
  }
  #page-zoom-wrap{
    margin-left:0;
  }
  #home-fixed-top{
    position:fixed;
    top:0; left:0;
    width:100%;
    z-index:500;
    background:#e9e9e9;
    margin-left:0;
    box-sizing:border-box;
  }
  body.magnifier-mode #home-fixed-top{
    display:none;
  }
  #page-zoom-spacer{
    position:absolute;
    top:0; left:0;
    width:1px; height:1px;
    opacity:0;
    pointer-events:none;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  #portrait-lock-overlay{
    display:none;
    position:fixed; inset:0; z-index:99999;
    background:#000; color:#fff;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    font-size:16px; line-height:1.8;
  }
  #header-top-bg-wrap{
    position:fixed;
    top:0; left:0; right:0;
    z-index:900;
    background:#e9e9e9;
    display:none;
  }
  body.magnifier-mode #header-top-bg-wrap{
    display:block;
  }
  body.magnifier-mode.recent-only-mode #header-top-bg-wrap{
    display:none;
  }
  body.magnifier-mode #header-top-bg-wrap header.top{
    position:static;
  }
  header.top{ padding:0 0 6px; margin:0 0.5%; }
  .brand{ display:flex; flex-direction:column; gap:2px; position:relative; }
  .brand-title-overlay{
    position:static; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#1a1a1a; letter-spacing:1px; white-space:nowrap;
    overflow:visible; pointer-events:none; line-height:1.15;
  }
  .brand-title-overlay .rc{ display:inline-block; text-shadow:0 1px 2px rgba(0,0,0,0.45), 0 0 6px rgba(255,255,255,0.25); }
  .game-tabs{ display:flex; gap:5px; width:100%; }
  .game-tabs button{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:3px;
    background:#111; border:1.5px solid var(--gold); color:#fff;
    border-radius:6px; padding:0 2px;
    /* 2026-08-30：按鍵大小不變(高度固定31px＝原本 5px+15px字高+5px+邊框)，裡面的文字最大化：
       字級由15px放大到 min(7.2vw, 26px)，行高1，三個中文字剛好塞滿按鍵 */
    height:31px; box-sizing:border-box;
    font-size:min(7.2vw, 26px); line-height:1; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:clip;
    -webkit-tap-highlight-color:transparent;
  }
  .game-tabs button.active{ background:var(--gold); color:#000; }
  .coming-soon{
    margin:12px 14px; padding:40px 16px; text-align:center;
    background:#ffffff; border:1.2px solid #000; border-radius:4px;
    color:var(--ink-dim); font-size:13px; line-height:1.8;
  }
  .coming-soon strong{ display:block; font-size:16px; color:var(--ink); margin-bottom:6px; }
  .hero{
    margin:0 0.5%; background:#ffffff; border:2px solid #e02020; border-radius:4px;
    padding:10px 12px;
    display:flex; flex-direction:column; gap:10px;
    outline:3px solid #ffffff; outline-offset:0;
    position:relative;
  }
  /* 紅線區尺寸鎖定：2026/08/23 使用者要求鎖死此區塊高度(202px)，避免之後調整內部字體大小
     時把外框撐大/縮小。寬度故意不鎖死，維持原本跟著螢幕寬度等比例縮放(margin:0 0.5%)，
     否則會跟畫面其他區塊(分類按鈕、開獎單表格)對不齊，這是2026/08/23實測發現的教訓，
     不要再改回鎖死寬度。
     之後任何修改都不能讓這個區塊的大小跟著變動。若之後要調整紅線區本身的內容/大小，
     必須先跟使用者確認，不能因為改別的地方而連帶影響到這裡。 */
  .red-line-zone{
    height:202px !important;
    min-height:202px !important;
    max-height:202px !important;
    box-sizing:border-box !important;
    overflow:hidden;
  }
  #hero-nine-grid{
    display:none;
    flex:1;
    min-height:0;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:6px;
    width:100%;
  }
  #hero-nine-grid button{
    width:100%; height:100%;
    min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    background:#cfe8ff !important; color:#000 !important; border:2px solid #ff0000 !important; border-radius:4px; /* 2026-08-30：九宮格統一淺藍底、紅框、黑字 */
    font-size:9px;
    overflow:hidden;
    padding:0;
  }
  /* 2026-08-30：九宮格按鍵取消所有圖示，字體統一並在按鍵內最大化 */
  #hero-nine-grid button .icon-frame{ display:none !important; }
  #hero-nine-grid button .btn-label, #hero-nine-grid button .blank-btn-label{
    font-size:clamp(16px, 7.4vw, 34px); font-weight:700; line-height:1; letter-spacing:0; white-space:nowrap;
    font-family:inherit; color:#000;
  }
  .hero-left{ min-width:0; }
  .hero-date-row{ display:flex; flex-wrap:nowrap; align-items:center; justify-content:space-between; gap:6px; }
  .hero-date{ font-size:18px; font-weight:600; margin-top:2px; display:inline-block; }
  .hero-controls-row{
    display:flex; gap:8px; align-items:stretch;
  }
  .clean-sheet-btn{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center;
    background:#000; border:2.5px solid #33D17A; color:#fff;
    border-radius:8px; font-size:34px; font-weight:700;
    padding:8px 4px;
    -webkit-tap-highlight-color:transparent;
  }
  .clean-sheet-btn.saving{ opacity:0.6; }
  .paper-size-menu{
    background:#fff; border:1.5px solid #e02020; border-radius:8px;
    padding:8px; z-index:999;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    flex-direction:column; align-items:stretch; gap:6px;
    width:120px;
  }
  .paper-size-menu-title{
    font-size:11px; color:#666; text-align:center; font-weight:700;
  }
  .paper-size-option{
    background:#fff; border:1.5px solid #e02020; color:#000;
    border-radius:6px; font-size:14px; font-weight:700;
    padding:6px 0; -webkit-tap-highlight-color:transparent;
  }
  .paper-size-option.active{ background:#e02020; color:#fff; }
  /* ===== 完整版(2026-09-10 第109條，自抓牌終極第108條移植)：全部按鍵改立體(彩券切換、尺寸/印單、±、結束/首頁抓牌、尺寸選單選項、統計表內選項) ===== */
  .game-tabs button, .clean-sheet-btn, .blank-stepper button, #home-exit-btn, .paper-size-option{
    background-image:linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 48%, rgba(0,0,0,.10) 52%, rgba(0,0,0,.24) 100%) !important;
    box-shadow:0 3px 0 rgba(0,0,0,.55), 0 5px 8px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.45) !important;
    text-shadow:0 1px 1px rgba(0,0,0,.5);
    transform:translateY(-2px);
    transition:transform .06s, box-shadow .06s;
  }
  .game-tabs button.active, .paper-size-option.active{ text-shadow:0 1px 0 rgba(255,255,255,.5); box-shadow:0 3px 0 #a88a00, 0 5px 8px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.6) !important; }
  .blank-stepper button{ background-color:#eaf4ff !important; }
  .blank-stepper button:active{ background-color:#3FA9FF !important; }
  .game-tabs button:active, .clean-sheet-btn:active, .blank-stepper button:active, #home-exit-btn:active, .paper-size-option:active{
    transform:translateY(1px);
    box-shadow:0 0 0 rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.45), inset 0 2px 4px rgba(0,0,0,.35) !important;

【八、效能／記憶體優化紀錄（2026-08-21）】
  背景：使用者回報手機上「經常無法讀取網頁」（Chrome renderer 被系統強制關閉）。
  這次用無頭 Chromium 實測後確認：不是慢性記憶體洩漏，而是存檔當下的瞬間爆量。

  ● 實測基準（412x915 手機視窗、A3 輸出）
    重複呼叫 buildPanels() 40 次、切換玩法 20 次、visibilitychange 30 次之後，
    JS heap / DOM 節點數 / 事件監聽器數量都沒有成長 → 排除 detached DOM 累積。
    但按一次「存」或「印」，畫布記憶體會瞬間衝到 136MB 而且不會馬上釋放；
    若「存」和「印」時間接近而重疊，峰值可達 272MB —— 手機 renderer 會直接被砍。

  1. 存檔流程移除多餘的全尺寸中繼畫布
     原本：html2canvas 產出 rawCanvas → 再建一張同尺寸(+留白)的 canvas 複製過去
     → 在上面補畫文字 → 再縮放進 A3 紙張畫布。三張大圖同時存在。
     現在：直接在 html2canvas 回傳的畫布上補畫文字，留白改成縮放進紙張時才內縮，
     視覺結果一樣（實測只有最外框線位移不到 1px，內容像素完全相同）。

     ⚠️ 這裡有個很容易踩的坑：html2canvas 回傳的畫布，它的 2D context 內部
     還留著 scale(6,6) 的變換矩陣。要重用這張畫布補字，必須先
     ctx.setTransform(1,0,0,1,0,0) 把變換重設回單位矩陣，
     否則所有已經自己乘過 captureScale 的座標與字級會被再乘一次（字會變超大）。

  2. 畫布用完立刻釋放（releaseCanvasMemory()）
     把 canvas.width/height 設為 0 可以馬上釋放底層點陣圖，不必等 GC。
     來源畫布在畫進紙張後釋放、紙張畫布在產生 PNG 後釋放。

  3. 存檔互斥鎖（captureBusy）
     「存」和「印」共用一個旗標，避免兩個截圖同時進行造成記憶體加倍。

     實測結果：單次存檔瞬時峰值 136.3MB → 100.5MB；
     存完之後仍佔用 136.3MB → 0MB；兩個存檔同時觸發 272.5MB → 100.5MB。

  4. C 式弧線 rAF 迴圈：沒變就不重畫
     原本 renderCModeArcLoop() 每一幀都無條件 svg.innerHTML="" 再重建所有
     path/line，而且每畫一條就穿插一次 getBoundingClientRect()（layout thrashing）。
     現在改成：
       - 先用四個錨點 rect + 連線/弧線陣列的物件識別組成 signature，
         跟上一幀相同就整段跳過（cModeArcSig / cModeArcPairsRef / cModeArcArcsRef）
       - 真的要重畫時，先把所有 rect 一次量完（純讀），再用 DocumentFragment
         一次掛上去（純寫），避免讀寫交錯觸發重複 reflow
       - 上下桿那兩條紅色 path 改成重用既有節點，只更新 d 屬性
     clearCModeOverlay() 會把 signature 作廢，確保下次一定完整重畫。

     實測結果：C 式靜止 3 秒，弧線層 DOM 變動 543 次 → 0 次；
     連線數量多時的每幀重繪成本（6 倍 CPU 節流）：
       10 條 3.0ms→1.3ms、30 條 9.7ms→2.8ms、60 條 21.4ms→5.1ms、100 條 34.4ms→6.0ms。
     （60 條以上原本已經超過 16.7ms 的一幀預算，等於持續掉幀 + 持續燒電。）

  5. 雲端排程在畫面隱藏時跳過
     每 60 秒的 runScheduledCloudChecks() 加上 if(document.hidden)return。

  ● 已排除的懷疑項目（不用再花時間查）
    - buildPanels() 重複呼叫沒有留下 detached DOM，事件監聽器數量穩定
    - 切回 App 的 loadData() 節流（VISIBILITY_REFRESH_COOLDOWN_MS）確認有生效
    - 開機時間在 6 倍 CPU 節流下約 550ms，不是當機主因

     的正確重設生效。

     (minScrollY) 是用「反推出來的 padding 值 × 縮放倍率」估算，縮放倍率

     但 .panels 內容撐不滿，右側留白，且螢幕越寬留白越明顯 →
     applyDesktopScrollerWidth() 新增「非桌面分支」：量出 .scroller 實際
     可用寬度後，把 panels.style.zoom 往上調到剛好填滿（只放大填滿，
     不縮小硬塞，窄螢幕不受影響）。

  5. 上述兩個版面調整動作，原本都用 requestAnimationFrame 把「量測後
     設定最終大小」延到下一幀才做，中間會先畫出一次「錯誤/未調整前」
     的畫面，造成「先顯示小尺寸、再跳到正確大小」的閃爍 → 桌面/非桌面
     兩個分支都改成完全同步計算，不再等下一幀；另外 applyRecentOnly()
     進入定期十六/C式/E式時的縮放計算，改成先把 panels/scrollerEl設成
     visibility:hidden，算完最終縮放跟定位後才顯示，避免看到中間放大
     過程的跳動。

  6. 首頁開獎單處在放大狀態時切換 539/六合彩/天天樂/大樂透分頁，新分頁

     被壓縮貼左）→ setupGameTabs() 的點擊事件最前面，立刻呼叫
     window.__resetPinchState()、把 pageZoom 強制重設回 1 並套用、捲動
     回頂端，確保切換分頁後一定是乾淨、正常大小的畫面。

  7. 月初第一期的日期字串（例如「8/1」「2/2」，class="fom"）沒有真正
     置中，固定偏左一點點 → 根本原因是原本用
     transform:translate(-50%) scale(0.48) 同時做「置中」跟「縮小」：
     CSS 規定 translate 的百分比是用縮放前的元素尺寸去算，但套用到的是
     縮放後看起來變小的文字框，兩者對不上，就會產生固定的系統性偏移
     （無論文字內容是什麼，偏移量都一樣，不是文字本身的問題）。
     改成不用 scale()，直接把 font-size 設成縮小後的實際數值
     （13.5px × 0.48 ≈ 6.48px），純用 text-align:center 置中，
     沒有縮放變形，數學上不會再有偏移。

  （360～1080px）實際模擬、量測像素數值後才確認修復，不是憑肉眼猜測；
  第7項也用同樣方式量出置中前後的左右像素差，確認偏移消除。

【十、GitHub 雲端同步機制修復紀錄（2026-08-27）】
  背景：使用者發現「GitHub 上明明已經更新到8/25、8/26，App 卻一直停在很舊的
  資料」，查下去發現 syncCrawlerDataFromGithub() 其實從未成功同步過任何一種
  玩法的完整資料，共有 3 個獨立問題：

  1. 日期格式解析失敗：normalizeCrawlerDate() 的 ISO 日期正規表示式只接受
     純日期"2026-08-26"，但 GitHub 上「今彩539」「大樂透」的 draw_date 欄位
     其實帶了時間戳，是"2026-08-26T00:00:00"格式，一有後面的T就直接解析
     失敗回傳null，導致這兩種玩法的每一筆資料在來源端就被整批跳過。
     → 正規表示式改成 /^(\d{4})-(\d{1,2})-(\d{1,2})(?:T.*)?$/，允許可有可無
     的T後綴。

  2. 【最關鍵】作用域錯誤導致同步「處理完第一筆新資料就當機」：
     manualUpsertDrawRecord() 內部呼叫的 purgeStaleNumPickedEntriesForDate()
     是一個頂層函式，但它直接讀寫 numPickedEntries / numPickedEntriesCDing /
     numPickedEntriesCHe / numPickedEntriesCCha 這幾個變數——這些變數其實是
     宣告在 setupImageView() 閉包內部的區域變數，只有閉包內的程式碼摸得到。
     從閉包外面（例如 GitHub 同步、開機時的 loadData 等頂層流程）呼叫
     manualUpsertDrawRecord 時，一路呼叫到 purgeStaleNumPickedEntriesForDate
     就會丟出 ReferenceError，把整個 syncCrawlerDataFromGithub() 的
     try/catch 整段中斷。因為 toApply 是用 .reverse() 從舊到新依序套用，
     所以每次同步實際上「只會成功套用最舊的那一筆新資料，套用第二筆時就
     當掉」，也因此 App 資料才會一直停滯不前，即使 GitHub 上已經有很多筆
     新資料。這是一個相當隱蔽的 bug：因為每次同步「至少會成功一筆」，
     表面上看起來像是「有在動，只是比較慢」，實際上完全卡住。
     → 修法：在 setupImageView() 閉包內（真正摸得到那幾個變數的地方），
     新增 window.__purgeStaleNumPickedInMemory(dateStr) 把清理邏輯包起來
     暴露出去，同時也暴露 window.__loadNumPickedFromStorage /
     window.__saveNumPickedToStorageRaw 這兩個原本也是閉包內部、外部呼叫
     不到的輔助函式。頂層的 purgeStaleNumPickedEntriesForDate() 改成呼叫
     這幾個 window.__ 開頭的暴露函式，不再直接觸碰閉包內部變數。

  3. GitHub 同步機制原本完全靜默，使用者無從得知「同步了沒、同步到哪」：
     syncCrawlerDataFromGithub() 新增 updatesFound 追蹤陣列，同步完成後
     若有實際套用新資料，會呼叫新增的 showGithubSyncedBanner() 顯示綠色
     提示條「☁️ 已從 GitHub 雲端同步到最新開獎資料：539：已從...同步到...」，
     8秒後自動消失，同時寫入瓢蟲除錯記錄(logEvent)方便事後查證。
     （另外保留原本 checkCloudUpdates() 用的 showCloudUpdateBanner()，
     文字是「偵測到更新、可能不是最新」，語意上不適合套用在「已經同步完成」
     的情境，所以另外寫了語意正確的 showGithubSyncedBanner()，兩者不要
     搞混或誤用。）

  以上三點都用無頭 Chromium 實際重現過修復前的當機、以及修復後四種玩法
  （539/六合彩/天天樂/大樂透）全部正確同步到 GitHub 最新資料、正確顯示
  提示 banner，才確認修復完成，不是憑程式碼推論。

function dayOf(iso){return iso.split("-")[2]}
function futureSlots(lastDateIso,count,allowedWeekdays){window.__bootStage&&window.__bootStage("futureSlots 日期="+lastDateIso);/* 防呆(2026-08-30)：lastDateIso格式錯誤(例如爬蟲塞進來的"2026/08/30"或undefined)會變成Invalid Date，
   getDay()=NaN永遠不在allowedWeekdays裡→while迴圈永遠跑不完→整個App一開機就卡死。這裡先驗證日期格式、無效就改用今天，
   allowedWeekdays為空陣列也一律視為不限制，並加上最多400圈的保險絲。 */let baseIso=typeof lastDateIso==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(lastDateIso)?lastDateIso:null;let d=baseIso?new Date(baseIso+"T00:00:00"):null;if(!d||isNaN(d.getTime())){const t=new Date();d=new Date(t.getFullYear(),t.getMonth(),t.getDate());}const wk=Array.isArray(allowedWeekdays)&&allowedWeekdays.length?allowedWeekdays:null;const out=[];let guard=0;while(out.length<count&&guard++<400){d.setDate(d.getDate()+1);if(wk&&wk.indexOf(d.getDay())===-1)continue;const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");out.push({date:y+"-"+m+"-"+day,weekday:WD_BY_JSDAY[d.getDay()],numbers:null})}return out}

const LOTTERY_DB_NAME="539_lottery_local_db";
const LOTTERY_DB_VERSION=2;
const LOTTERY_DB_STORES={539:"game539",daily:"gameDaily",mark6:"gameMark6",lotto:"gameLotto"};
const SETTINGS_STORE_NAME="settings";
let lotteryDBInstance=null;
function openLotteryDB(){return new Promise(function(resolve,reject){if(lotteryDBInstance){resolve(lotteryDBInstance);return}if(!window.indexedDB){reject(new Error("此瀏覽器不支援IndexedDB"));return}const req=indexedDB.open(LOTTERY_DB_NAME,LOTTERY_DB_VERSION);req.onupgradeneeded=function(e){const db=e.target.result;Object.values(LOTTERY_DB_STORES).forEach(function(storeName){if(!db.objectStoreNames.contains(storeName)){db.createObjectStore(storeName,{keyPath:"date"})}});if(!db.objectStoreNames.contains(SETTINGS_STORE_NAME)){db.createObjectStore(SETTINGS_STORE_NAME,{keyPath:"key"})}};req.onsuccess=function(e){lotteryDBInstance=e.target.result;resolve(lotteryDBInstance)};/* 2026-08-30：另一個分頁還開著舊版本的資料庫時open會被blocked，原本永遠不會resolve→開機卡在「讀本機資料庫」。加onblocked與8秒逾時直接reject，讓開機流程繼續(改用localStorage/內嵌資料) */req.onblocked=function(){reject(new Error("IndexedDB被其他分頁擋住(blocked)，請關閉其他開著本程式的分頁"))};setTimeout(function(){reject(new Error("IndexedDB開啟逾時"))},8000);req.onerror=function(e){reject(e.target.error)}})}
function saveSettingToLS(key,value){try{localStorage.setItem("539app_setting_"+key,JSON.stringify(value));return true}catch(e){console.warn("寫入設定到localStorage失敗（不影響App主要功能）：",key,e);return false}}
function loadSettingFromLS(key,fallback){try{const raw=localStorage.getItem("539app_setting_"+key);if(raw===null||raw===undefined)return fallback;return JSON.parse(raw)}catch(e){return fallback}}
async function saveSettingToDB(key,value){try{const db=await openLotteryDB();return await new Promise(function(resolve){const tx=db.transaction(SETTINGS_STORE_NAME,"readwrite");tx.objectStore(SETTINGS_STORE_NAME).put({key:key,value:value});tx.oncomplete=function(){resolve(true)};tx.onerror=function(){resolve(false)}})}catch(e){return false}}
async function loadSettingFromDB(key){try{const db=await openLotteryDB();return await new Promise(function(resolve){const tx=db.transaction(SETTINGS_STORE_NAME,"readonly");const req=tx.objectStore(SETTINGS_STORE_NAME).get(key);req.onsuccess=function(){resolve(req.result?req.result.value:undefined)};req.onerror=function(){resolve(undefined)}})}catch(e){return undefined}}
function saveSetting(key,value){saveSettingToLS(key,value);saveSettingToDB(key,value).catch(function(e){console.warn("寫入設定到IndexedDB失敗（不影響App主要功能，LS那份還在）：",key,e)})}
async function reconcileSettingFromDB(key,fallback){const lsValue=loadSettingFromLS(key,undefined);if(lsValue!==undefined)return lsValue;const dbValue=await loadSettingFromDB(key);if(dbValue!==undefined){saveSettingToLS(key,dbValue);return dbValue}return fallback}
async function saveDrawRecordToDB(gameKey,record){const storeName=LOTTERY_DB_STORES[gameKey];if(!storeName)return;try{const db=await openLotteryDB();await new Promise(function(resolve,reject){const tx=db.transaction(storeName,"readwrite");tx.objectStore(storeName).put(record);tx.oncomplete=resolve;tx.onerror=function(e){reject(e.target.error)}});}catch(e){console.warn("寫入本機資料庫失敗（不影響App主要功能）：",gameKey,e);}}
async function loadLotteryLocalDBIntoEmbedded(){const gameDataMap={539:EMBEDDED_DATA,daily:EMBEDDED_DAILY_DATA,mark6:EMBEDDED_MARK6_DATA,lotto:EMBEDDED_LOTTO_DATA};/* 效能：原本每筆都用findIndex線性掃描整個陣列(O(n²))，539有數千筆、開機要跑兩遍(LS+IndexedDB)、
   四種玩法，加起來上億次比較，是「App剛開啟卡卡的」主因。改成每個目標陣列建一張date→index的Map，
   合併變O(n)；新筆先push、最後一次sort回日期順序(finalizeMergedArrays)，不再逐筆splice */
const mergeIndexCache=new Map();const mergeDirtyArrays=new Set();
function getMergeIndex(targetArray){let idxMap=mergeIndexCache.get(targetArray);if(!idxMap){idxMap=new Map();for(let i=0;i<targetArray.length;i++)idxMap.set(targetArray[i].date,i);mergeIndexCache.set(targetArray,idxMap)}return idxMap}
function mergeRecordInto(targetArray,record){if(!record||typeof record.date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(record.date))return;/* 日期格式不對的資料直接略過，避免壞資料進到表格 */const idxMap=getMergeIndex(targetArray);const idx=idxMap.get(record.date);if(idx!==undefined){const existing=targetArray[idx];const existingTime=typeof existing._savedAt==="number"?existing._savedAt:0;const incomingTime=typeof record._savedAt==="number"?record._savedAt:0;if(incomingTime>=existingTime){targetArray[idx]=record}}else{idxMap.set(record.date,targetArray.length);targetArray.push(record);mergeDirtyArrays.add(targetArray)}}
function finalizeMergedArrays(){mergeDirtyArrays.forEach(function(arr){arr.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})});mergeDirtyArrays.clear();mergeIndexCache.clear()}for(const gameKey of Object.keys(gameDataMap)){const targetArray=gameDataMap[gameKey];const lsRecords=loadDbFromLocalStorage(gameKey);if(lsRecords&&lsRecords.length>0){const lsLast=lsRecords.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).pop();console.log("【診斷】localStorage["+gameKey+"] 共 "+lsRecords.length+" 筆，先套用");lsRecords.forEach(function(lsRecord){mergeRecordInto(targetArray,lsRecord)})}else{}}try{const db=await openLotteryDB();for(const gameKey of Object.keys(gameDataMap)){const storeName=LOTTERY_DB_STORES[gameKey];if(!storeName)continue;const targetArray=gameDataMap[gameKey];const dbRecords=await new Promise(function(resolve,reject){const tx=db.transaction(storeName,"readonly");const store=tx.objectStore(storeName);const req=store.getAll();req.onsuccess=function(){resolve(req.result||[])};req.onerror=function(e){reject(e.target.error)}});const sortedForLog=dbRecords.slice().sort(function(a,b){return a.date<b.date?-1:1});const last3=sortedForLog.slice(-3);console.log("【診斷】IndexedDB["+gameKey+"] 共 "+dbRecords.length+" 筆，再套用比對新舊，最近3期：",last3.map(function(r){return r.date+"("+r.weekday+") "+r.numbers.join(",")+(typeof r.special==="number"?" 特別號"+r.special:"")}));dbRecords.forEach(function(dbRecord){mergeRecordInto(targetArray,dbRecord)})}}catch(e){console.warn("從IndexedDB讀回資料失敗（改靠localStorage那份備援，不影響App主要功能）：",e)}if(data539Cache&&Array.isArray(data539Cache)){EMBEDDED_DATA.forEach(function(record){mergeRecordInto(data539Cache,record)})}finalizeMergedArrays()}
async function syncLotteryLocalDB(){const gameDataMap={539:EMBEDDED_DATA,daily:EMBEDDED_DAILY_DATA,mark6:EMBEDDED_MARK6_DATA,lotto:EMBEDDED_LOTTO_DATA};try{const db=await openLotteryDB();for(const gameKey of Object.keys(gameDataMap)){const storeName=LOTTERY_DB_STORES[gameKey];const records=gameDataMap[gameKey];await new Promise(function(resolve,reject){const tx=db.transaction(storeName,"readwrite");const store=tx.objectStore(storeName);records.forEach(function(record){store.put(record)});tx.oncomplete=resolve;tx.onerror=function(e){reject(e.target.error)}})}}catch(e){console.warn("同步本機資料庫失敗（不影響App主要功能）：",e)}}

function centerHomepageWrap(){if(document.body.classList.contains("magnifier-mode"))return;const wrap=document.getElementById("page-zoom-wrap");if(!wrap)return;wrap.style.marginRight="";wrap.style.marginLeft="0";const rect=wrap.getBoundingClientRect();const vv=window.visualViewport;const viewportWidthForCenter=vv?vv.width:window.innerWidth;const extraSpace=viewportWidthForCenter-rect.width;if(extraSpace>1){wrap.style.marginLeft=Math.round(extraSpace/2)+"px"}}

const CRAWLER_GITHUB_RAW_URL="https://raw.githubusercontent.com/redwinds542688-gif/Lottery-database/main/data.json";
const CRAWLER_GAME_NAME_MAP={"今彩539":"539","香港六合彩":"mark6","加州天天樂":"daily","大樂透":"lotto"};
function normalizeCrawlerDate(raw,fallbackCheckedAt){
  const MONTH_MAP={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  if(typeof raw==="string"){
    const s=raw.trim();
    let m;
    m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:T.*)?$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{2,3})年(\d{1,2})月(\d{1,2})日$/);
    if(m){const y=parseInt(m[1],10)+1911;return y+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0")}
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m)return m[3]+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");
    m=s.match(/^[A-Za-z]{3}\/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})$/);
    if(m){const mo=MONTH_MAP[m[1].toUpperCase()];if(mo)return m[3]+"-"+String(mo).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0")}
  }
  if(typeof fallbackCheckedAt==="string"){
    const m2=fallbackCheckedAt.match(/^(\d{4}-\d{2}-\d{2})/);
    if(m2)return m2[1]
  }
  return null
}
async function syncCrawlerDataFromGithub(){
  try{

    const gameDataMap={

      daily:EMBEDDED_DAILY_DATA,
      mark6:EMBEDDED_MARK6_DATA,

    const updatesFound=[];
    /* 2026-09-08(效能)：整個套用迴圈包在runUpsertBatch裡，多筆新資料只存檔一次、重建表格一次 */
    runUpsertBatch(function(){Object.keys(CRAWLER_GAME_NAME_MAP).forEach(function(crawlerName){
      const gameKey=CRAWLER_GAME_NAME_MAP[crawlerName];
      const crawlerRecords=json[crawlerName];
      if(!Array.isArray(crawlerRecords)||crawlerRecords.length===0)return;
      const localArr=gameDataMap[gameKey]||[];
      const localLatest=localArr.length?localArr[localArr.length-1]:null;
      const localLatestDate=localLatest?localLatest.date:"";

        if(!dateStr)continue;

        const numbers=(rec.numbers||"").trim().split(/\s+/).map(function(s){return parseInt(s,10)}).filter(function(n){return!isNaN(n)});
        if(numbers.length===0)continue;
        const specialParsed=rec.special_number&&String(rec.special_number).trim()?parseInt(rec.special_number,10):NaN;
        if(dateStr===localLatestDate&&localLatest){
          const localNumsStr=localLatest.numbers.map(function(n){return String(n).padStart(2,"0")}).join(" ");
          const crawlerNumsStr=numbers.slice().sort(function(a,b){return a-b}).map(function(n){return String(n).padStart(2,"0")}).join(" ");

        /* toApply 是「新到舊」排序，第0筆就是這次同步到的最新日期，
           要在 .reverse() 破壞順序之前先記下來，用來顯示提示 banner */

    })});

      if(typeof logEvent==="function")logEvent("GitHub同步","偵測到更新："+updatesFound.map(function(u){return u.label+" "+u.localDate+"→"+u.cloudDate}).join("、"));

    }
  }catch(e){
    console.warn("同步爬蟲資料失敗（不影響App主要功能）：",e)
  }
}

function __printOnce(){if(__printBusy||Date.now()<__printBusyUntil)return;__printBusy=true;cleanSheetBtn.classList.add("shot-lit");/* 長按亮燈，存好熄燈 */let r;try{r=saveCleanSheetImage()}catch(e){r=null}Promise.resolve(r).catch(function(){}).then(function(){__printBusy=false;__printBusyUntil=Date.now()+800;setTimeout(function(){cleanSheetBtn.classList.remove("shot-lit")},250)})}
cleanSheetBtn.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();__printSkipNextClick=false;/* 單擊無效 */});cleanSheetBtn.addEventListener("dblclick",function(e){e.preventDefault();e.stopPropagation();/* 雙擊無效 */});
/* 長按印單＝存檔一次：按住0.55秒觸發(手機震動一下)；放開後瀏覽器補發的 click 本來就不做事 */
let __printPressTimer=null;
function __printCancelPress(){if(__printPressTimer){clearTimeout(__printPressTimer);__printPressTimer=null}}
cleanSheetBtn.addEventListener("pointerdown",function(){__printSkipNextClick=false;__printCancelPress();__printPressTimer=setTimeout(function(){__printPressTimer=null;__printSkipNextClick=true;if(navigator.vibrate)navigator.vibrate(30);__printOnce()},550)});
cleanSheetBtn.addEventListener("pointerup",__printCancelPress);cleanSheetBtn.addEventListener("pointerleave",__printCancelPress);cleanSheetBtn.addEventListener("pointercancel",__printCancelPress);

}

/* ===== 新抓牌系統：主畫面底部兩顆按鍵(抓牌/結束)定位 =====
   算法照主程式 positionPinOnScreen() 的五格排法：螢幕寬分五格、每顆＝格寬88%、高31、貼底留2px；
   抓牌＝第1格、結束＝第5格。 */
const __HOME_PIN_MARGIN=2,__HOME_PIN_SIZE=30;
function positionHomeBottomButtons(){
  const vv=window.visualViewport;
  const __col=__homeColumnBounds();const baseLeft=__col.left,baseTop=vv?vv.offsetTop:0;
  const width=__col.width,height=vv?vv.height:window.innerHeight;
  const rowTop=Math.round(baseTop+height-__HOME_PIN_SIZE-__HOME_PIN_MARGIN);
  const slotW=width/5,btnW=Math.round(slotW*0.88),FLAT_BTN_H=31;
  const lefts=[];for(let i=0;i<5;i++)lefts.push(Math.round(baseLeft+slotW*i+(slotW-btnW)/2));
  [["zhuapai-btn",0],["home-exit-btn",4]].forEach(function(p){
    const el=document.getElementById(p[0]);if(!el)return;
    el.style.width=btnW+"px";el.style.height=FLAT_BTN_H+"px";el.style.borderRadius="7px";
    el.style.left=lefts[p[1]]+"px";el.style.top=rowTop+"px";el.style.visibility="visible";
  });
}
window.addEventListener("resize",positionHomeBottomButtons);
window.addEventListener("orientationchange",positionHomeBottomButtons);
if(window.visualViewport){window.visualViewport.addEventListener("resize",positionHomeBottomButtons);window.visualViewport.addEventListener("scroll",positionHomeBottomButtons)}

/* 寬螢幕的置中欄位置要等版面排好才確定(主程式的置中是分幾拍完成的)：開機與每次視窗尺寸改變後，短暫追蹤2秒，欄位一有變動就重排底部按鍵。手機(<900)不啟動。 */
let __homeColLast="",__homeColTimer=null;
function __watchHomeColumn(){
  const vv=window.visualViewport;const W=vv?vv.width:window.innerWidth;
  clearInterval(__homeColTimer);__homeColTimer=null;
  if(W<900){__homeColLast="";return}
  let n=0;
  __homeColTimer=setInterval(function(){
    const c=__homeColumnBounds();const sig=Math.round(c.left)+"|"+Math.round(c.width);
    if(sig!==__homeColLast){__homeColLast=sig;if(typeof window.showFloatButtons==="function")window.showFloatButtons();positionHomeBottomButtons()}
    if(++n>=14){clearInterval(__homeColTimer);__homeColTimer=null}
  },150);
}
window.addEventListener("resize",__watchHomeColumn);
window.addEventListener("orientationchange",__watchHomeColumn);
/* ===== 新抓牌系統：備用列(為之後「往下的捲動頁面」做準備) =====
   使用者設計(2026-09-21)：進入程式先進539，馬上計算「整張單子有幾期」，備用列就設幾期；切到六合彩／天天樂／大樂透也一樣。
   ★使用者澄清：備用列＝「目前螢幕顯示的期數」本身——也就是單子上現在顯示的那些期，照樣備一份、期數相同。
     不是往更早的歷史去另外找資料(第一版做錯成那樣，才會出現539差16期、天天樂差94期的問題；現在沒有「不夠」這回事)。
   ・期數直接數畫面上實際開出的列(不含下方空白期)，不寫死每欄幾列。
   ・備用列的內容＝單子上顯示的每一期(日期、號碼、特別號)，由舊到新，與畫面順序一致；是複製品，之後捲動頁面怎麼動它都不會影響原始開獎資料。
   ・每次開獎單重畫(開機、切彩券、調期數±、同步到新開獎)都重算。只放記憶體、不顯示。 */
const spareRowsByGame={};
function prepareSpareRows(all){
  const gameKey=currentGameKey;
  const sheetRows=Array.from(document.querySelectorAll("#panels table.road tr")).filter(function(tr){return tr.querySelector("td.num")&&!tr.classList.contains("future")});
  const sheetCount=sheetRows.length;
  const sortedAsc=(Array.isArray(all)?all:[]).slice().sort(function(a,b){return a.date.localeCompare(b.date)});
  const shown=sheetCount>0?sortedAsc.slice(-sheetCount):[];
  const rows=shown.map(function(d){return{date:d.date,numbers:Array.isArray(d.numbers)?d.numbers.slice():[],special:d.special}});
  const state={game:gameKey,sheetCount:sheetCount,spareCount:rows.length,
    firstDate:rows.length?rows[0].date:null,lastDate:rows.length?rows[rows.length-1].date:null,
    rows:rows,builtAt:Date.now()};
  spareRowsByGame[gameKey]=state;window.__spareRows=state;window.__spareRowsByGame=spareRowsByGame;
  return state;
}
{const __buildPanelsOrig=buildPanels;
 buildPanels=function(all,blanksCount){const r=__buildPanelsOrig.apply(this,arguments);try{prepareSpareRows(all)}catch(e){console.warn("備用列準備失敗（不影響開獎單顯示）：",e)}return r};}

/* ===== 新抓牌系統：開機流程(照主程式 boot() 的順序，只留主畫面用得到的步驟) ===== */
async function boot(){
  let localDbDone=false;
  const localDbPromise=loadLotteryLocalDBIntoEmbedded().then(function(){localDbDone=true}).catch(function(e){localDbDone=true;console.warn("開機讀取本機資料庫失敗（不影響App主要功能）：",e)});
  await Promise.race([localDbPromise,new Promise(function(r){setTimeout(r,4000)})]);
  if(!localDbDone){
    localDbPromise.then(function(){try{
      if(currentGameKey==="539"&&data539Cache){
        function __sig(arr){if(!Array.isArray(arr)||!arr.length)return"0";const a=arr[0],b=arr[arr.length-1];return arr.length+"|"+(a&&a.date)+"|"+(b&&b.date)+"|"+(b&&b.numbers?b.numbers.join(","):"")}
        if(__sig(currentAllData)===__sig(data539Cache)){currentAllData=data539Cache;return}
        currentAllData=data539Cache;buildPanels(currentAllData,currentBlanks);
      }}catch(e){console.warn(e)}});
  }
  skipNextLocalDbLoad=true;
  if(currentGameKey){
    const initialDataMap={539:data539Cache&&Array.isArray(data539Cache)?data539Cache:EMBEDDED_DATA,daily:EMBEDDED_DAILY_DATA,mark6:EMBEDDED_MARK6_DATA,lotto:EMBEDDED_LOTTO_DATA};
    const initialData=initialDataMap[currentGameKey];if(initialData)currentAllData=initialData;
  }
  blockNativePinchZoomInMagnifier();
  setupPageZoom();
  setupStepper();
  setupImageViewLite();
  setupGameTabs();
  runHomeInitialReset();
  setupHomeFixedTopHeightSync();
  requestAnimationFrame(positionHomeBottomButtons);
  __watchHomeColumn();
  window.addEventListener("pageshow",runHomeInitialReset);
  let lastVisibilityRefreshAt=Date.now();const VISIBILITY_REFRESH_COOLDOWN_MS=6e4;
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState!=="visible")return;
    runHomeInitialReset();
    const now=Date.now();if(now-lastVisibilityRefreshAt<VISIBILITY_REFRESH_COOLDOWN_MS)return;
    lastVisibilityRefreshAt=now;
    loadData();
    syncCrawlerDataFromGithub().catch(function(e){console.warn("同步爬蟲資料失敗（不影響其他功能）：",e)});
  });
  await loadData();
  await reconcilePaperSizeFromDB();
  await syncCrawlerDataFromGithub().catch(function(e){console.warn("同步爬蟲資料失敗（不影響其他功能）：",e)});
  try{
    const recoveredBlanksStash=await reconcileSettingFromDB("gameBlanksStash",{});
    Object.keys(recoveredBlanksStash).forEach(function(k){gameBlanksStash[k]=recoveredBlanksStash[k]});
    ["539","mark6","daily","lotto"].forEach(function(g){if(gameBlanksStash[g]===undefined)gameBlanksStash[g]=GAME_BLANK_DEFAULTS[g]!==undefined?GAME_BLANK_DEFAULTS[g]:BLANK_DEFAULT});
    saveSetting("gameBlanksStash",gameBlanksStash);
    if(currentGameKey&&gameBlanksStash[currentGameKey]!==undefined&&gameBlanksStash[currentGameKey]!==currentBlanks){currentBlanks=gameBlanksStash[currentGameKey]}
  }catch(e){console.warn("開機還原空白期數設定失敗（不影響App主要功能）：",e)}
  if(currentGameKey){
    const refreshedDataMap={539:data539Cache&&Array.isArray(data539Cache)?data539Cache:EMBEDDED_DATA,daily:EMBEDDED_DAILY_DATA,mark6:EMBEDDED_MARK6_DATA,lotto:EMBEDDED_LOTTO_DATA};
    const refreshedData=refreshedDataMap[currentGameKey];
    const bootSigNow=refreshedData?refreshedData.length+"|"+(refreshedData.length?refreshedData[refreshedData.length-1].date:"")+"|"+currentBlanks:"";
    if(refreshedData&&(refreshedData!==currentAllData||bootSigNow!==bootBuiltSignature)){currentAllData=refreshedData;buildPanels(currentAllData,currentBlanks)}
  }
  syncLotteryLocalDB().catch(function(e){console.warn("本機資料庫初始同步失敗（不影響App主要功能）：",e)});
}
boot().catch(function(e){console.error("boot失敗",e)});

<script>
/* ★★版面守衛(2026-09-15 使用者定案「把設定寫進程式 不要隨便又因為什麼問題又亂掉了」)——執行期檢查兩條版面硬規定，違反就自動修正並記錄：
   1. 首頁紅線區：球一律同一排、印／期數／抓那排按鍵完整在紅線區內(不可被 202px 鎖高切掉)。
   2. 五顆功能鍵的文字一律一行左右顯示。
   觸發：載入、換彩種(#game-tabs 點擊)、resize、字型載入完成、body class 改變(進出各模式)。只修正、不動 CSS 規則本身。 */
(function(){
  function log(d){try{if(typeof logEvent==="function")logEvent("版面守衛",d)}catch(e){}}
  function fixHero(){
    var hero=document.getElementById("hero"),balls=document.getElementById("hero-balls");if(!hero||!balls)return;
    if(getComputedStyle(hero).display==="none"||document.getElementById("hero-nine-grid")&&getComputedStyle(document.getElementById("hero-nine-grid")).display!=="none")return;
    var kids=Array.prototype.slice.call(balls.children).filter(function(b){return b.classList&&b.classList.contains("ball")});if(!kids.length)return;
    var controls=hero.querySelector(".hero-controls-row");
    function bad(){
      var tops=kids.map(function(b){return Math.round(b.getBoundingClientRect().top)});
      var twoRows=Math.max.apply(null,tops)-Math.min.apply(null,tops)>2;
      var heroR=hero.getBoundingClientRect();var over=controls&&controls.getBoundingClientRect().bottom>heroR.bottom-parseFloat(getComputedStyle(hero).paddingBottom)+1;
      return twoRows||over;
    }
    /* 先拿掉上次守衛加的尺寸再量(同一個同步流程裡量完馬上補回，不會閃)，否則 CSS 修好後守衛的補丁會一直留著、或補丁被拿掉後沒再檢查 */
    kids.forEach(function(b){if(b.dataset.guardSized){b.style.removeProperty("width");b.style.removeProperty("height");b.style.removeProperty("font-size");delete b.dataset.guardSized}});
    if(!bad())return;
    var w=balls.getBoundingClientRect().width;var gap=parseFloat(getComputedStyle(balls).columnGap||getComputedStyle(balls).gap)||5.5;
    var size=Math.floor((w-gap*(kids.length-1))/kids.length);if(!(size>10))return;
    var tries=0;
    while(tries++<6){
      kids.forEach(function(b){b.style.setProperty("width",size+"px","important");b.style.setProperty("height",size+"px","important");b.style.setProperty("font-size",Math.round(size*0.625)+"px","important");b.dataset.guardSized="1"});
      if(!bad())break;size-=2;
    }
    log("紅線區：球"+kids.length+"顆放不下/按鍵列被切 → 球徑改 "+size+"px");
  }
  function fixLabels(){
    ["float-save-btn","float-back-btn","fullpage-btn","period-btn","bug-log-fab","home-exit-btn"].forEach(function(id){
      var b=document.getElementById(id);if(!b)return;var l=b.querySelector(".fullpage-mode-label");if(!l||getComputedStyle(b).display==="none")return;
      if(l.dataset.guardNowrap){l.style.removeProperty("white-space");l.style.removeProperty("font-size");delete l.dataset.guardNowrap}
      var lh=parseFloat(getComputedStyle(l).lineHeight)||31;var h=l.getBoundingClientRect().height;
      if(h<=lh+1)return;
      l.style.setProperty("white-space","nowrap","important");l.dataset.guardNowrap="1";
      var fs=parseFloat(getComputedStyle(l).fontSize)||30;var tries=0;
      while(tries++<12&&l.scrollWidth>b.clientWidth+2){fs-=1;l.style.setProperty("font-size",fs+"px","important")}
      log("功能鍵 "+id+" 文字疊成兩行 → 改一行"+(tries>1?"、字級 "+fs+"px":""));
    });
  }
  var timer=null;function run(){if(timer)clearTimeout(timer);timer=setTimeout(function(){timer=null;try{fixHero();fixLabels()}catch(e){log("失敗 "+e)}},120)}
  window.__layoutGuard=run;
  window.addEventListener("load",run);window.addEventListener("resize",run);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(run);
  var tabs=document.getElementById("game-tabs");if(tabs)tabs.addEventListener("click",function(){setTimeout(run,50);setTimeout(run,600)});
  try{new MutationObserver(run).observe(document.body,{attributes:true,attributeFilter:["class"]})}catch(e){}
  try{var hb=document.getElementById("hero-balls");if(hb)new MutationObserver(run).observe(hb,{childList:true})}catch(e){}
  run();
})();
</script>
